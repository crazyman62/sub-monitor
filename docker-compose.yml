version: '3.8'

services:
  emby-manager:
    build: .
    container_name: emby_manager
    restart: unless-stopped
    ports:
      - "5005:5005"
    volumes:
      - ./data:/data
    environment:
      - SECRET_KEY=generate_a_secure_random_key_here
      - DATABASE_PATH=sqlite:////data/emby_manager.db
      - TZ=UTC # Change to your TrueNAS timezone, e.g., America/New_York
